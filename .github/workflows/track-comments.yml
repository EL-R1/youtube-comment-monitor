name: Track YouTube Comments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  list-envs:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.get-envs.outputs.environments }}
    steps:
      - id: get-envs
        run: |
          envs=$(gh api /repos/${{ github.repository }}/environments \
            --jq '[.environments[].name]')
          echo "environments=$envs" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  track:
    needs: list-envs
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.list-envs.outputs.environments) }}
      fail-fast: false
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: data/
          key: snapshot-${{ matrix.environment }}-${{ github.run_id }}
          restore-keys: |
            snapshot-${{ matrix.environment }}-

      - run: echo "$COOKIES" > cookies.txt
        env:
          COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        continue-on-error: true

      - name: Run for each video
        run: |
          for video_id in $(echo '${{ secrets.VIDEO_IDS }}' | jq -r '.[]'); do
            echo "=== Traitement de $video_id ==="
            SNAPSHOT_PATH="data/${{ matrix.environment }}/$video_id.json" \
            VIDEO_ID="$video_id" python -m src.main
          done
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COOKIES_FILE: cookies.txt
          NOTIFY_MODIFIED: ${{ secrets.NOTIFY_MODIFIED || 'true' }}
